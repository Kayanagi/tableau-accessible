<!DOCTYPE html>
<html lang="fr">
<head>

  <meta name="theme-color" content="#4a2fcc">
  <meta name="robots" content="noindex">
  <!-- Le jeton est dans le fragment, jamais envoyé ; il est de plus retiré de l'adresse dès le chargement. -->

  <title>Nouveau mot de passe — Baro, le tableau blanc accessible</title>
  <!-- Chemins absolus : page publique, servie sans session comme connexion.html. -->

<body>
  <a href="#reinitialiser-main" class="skip-link">Aller au contenu principal</a>

      <p class="login-brand">Baro, le tableau blanc accessible</p>

      </div>

        <p class="field-hint">Un problème pour retrouver l’accès à votre compte ? Écrivez à <a href="mailto:rgpd@dwes.fr">rgpd@dwes.fr</a>. Consultez la page <a href="/confidentialite.html" target="_blank" rel="noopener">Confidentialité (nouvel onglet)</a> pour savoir quelles données Baro conserve.</p>
      </footer>
    </div>
  </main>
  <div id="announcer" aria-live="polite" aria-atomic="true" class="sr-only"></div>
  <script type="module" src="/js/reinitialiser.js"></script>
