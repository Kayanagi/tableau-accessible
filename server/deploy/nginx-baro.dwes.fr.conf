# Configuration cible du vhost baro.dwes.fr : site entièrement verrouillé par session (v1.10.0).
# Procédure d'application et retour arrière : docs/verrou-et-partage.md, « Déploiement du verrou ».
#
# Principes :
# - auth_request est posé au niveau du serveur : tout est fermé par défaut, y compris un location
#   ajouté plus tard. Seuls les blocs marqués « auth_request off » sont publics.
# - Aucun add_header ailleurs qu'au niveau du serveur : un seul add_header dans un location
#   annulerait tous ceux hérités (HSTS, CSP, Cache-Control, etc.).
# - Cache-Control vaut pour toutes les réponses : une même URL renvoie la connexion ou le fichier
#   demandé selon le cookie, aucun cache partagé ne doit la garder.

server {
    listen 80;
    listen [::]:80;
    server_name baro.dwes.fr;
    access_log /var/log/nginx/baro_access.log;
    include snippets/acme.conf;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name baro.dwes.fr;
    ssl_certificate /etc/letsencrypt/live/baro.dwes.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baro.dwes.fr/privkey.pem;
    access_log /var/log/nginx/baro_access.log;
    error_log /var/log/nginx/baro_error.log;

    root /var/www/tableau-accessible;
    index index.html;
    include snippets/headers-portfolio.conf;
    add_header Cache-Control "private, no-cache" always;

    # Sans session : la connexion, à la même URL (le fragment #/tableau/<id> reste dans la barre d'adresse).
    auth_request /_baro/session;
    error_page 401 =200 /connexion.html;
    # Serveur Baro injoignable : on reste fermé, nginx traduit l'échec du contrôle en 500.
    error_page 500 =503 /connexion.html;

    # Refusés avant le contrôle de session, pour tout le monde.
    location ~* /\.git { return 404; }
    location ~ /\.(?!well-known) { deny all; }
    location ^~ /tests/ { return 404; }
    location ^~ /server/ { return 404; }
    location ~* \.md$ { return 404; }

    # Publics : la correspondance exacte l'emporte sur les expressions régulières et sur /.
    location = /connexion.html { auth_request off; }
    location = /css/connexion.css { auth_request off; }
    location = /js/connexion.js { auth_request off; }
    location = /confidentialite.html { auth_request off; }
    # Mot de passe oublié (v1.11.0) : le jeton est dans le fragment, il n'atteint pas ce journal.
    location = /reinitialiser.html { auth_request off; }
    location = /js/reinitialiser.js { auth_request off; }

    # L'API contrôle elle-même sessions et droits.
    location ^~ /api/ {
        auth_request off;
        include snippets/proxy.conf;
        proxy_read_timeout 120s;
        client_max_body_size 4m;
        proxy_pass http://127.0.0.1:3006;
    }

    # Le contrôle de session. Ne prend aucun corps, n'est jamais joignable de l'extérieur.
    location = /_baro/session {
        internal;
        auth_request off;
        proxy_pass http://127.0.0.1:3006/api/session;
        proxy_method GET;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Content-Type "";
        proxy_set_header Connection "";
        proxy_set_header Upgrade "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
